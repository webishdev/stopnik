name: Create STOPnik release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CGO_ENABLED: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Show tag
        run: echo "Building for release ${{ github.event.release.tag_name }}"

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Display Go version
        run: go version

      - name: Test
        run: |
          make test

      - name: Build
        run: |
          VERSION_INPUT=${{ github.event.release.tag_name }}
          CURRENT_VERSION=${VERSION_INPUT:-"ci"}
          make build-all VERSION=$CURRENT_VERSION

      - name: Lint
        run: make lint

      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build_result
          path: bin/**
          retention-days: 1

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Retrieve artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build_result
          merge-multiple: true
          path: bin

      - name: Display structure of downloaded files
        run: ls -hR

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stopnik:${{ github.event.release.tag_name }},ghcr.io/${{ github.repository_owner }}/stopnik:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  update-release:
    runs-on: ubuntu-latest
    needs: ["build", "build-and-push-image"]
    steps:
      - name: Retrieve artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build_result
          merge-multiple: true
          path: bin

      - name: Display structure of downloaded files
        run: ls -hR

      - name: Collect archives
        run: |
          mkdir release
          # keep the established asset names, e.g. stopnik.v1.0.0-macos-arm64.zip
          for archive in bin/*/*.zip; do
            name=$(basename "$archive")
            cp "$archive" "release/${name/-darwin-/-macos-}"
          done

          cd release
          sha256sum *.zip > SHA256SUMS

          cat SHA256SUMS

      - name: Display created files
        run: ls -hR release

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |
            ## Binary Downloads
            The compiled binaries for Linux, macOS and Windows (amd64 and arm64) are attached to this release as ZIP archives.
            Checksums for all archives are available in `SHA256SUMS`.

            ## Docker Container
            Docker images are available at:
            - **Tagged version**: `ghcr.io/${{ github.repository_owner }}/stopnik:${{ github.event.release.tag_name }}`
            - **Latest version**: `ghcr.io/${{ github.repository_owner }}/stopnik:latest`
          files: |
            release/*.zip
            release/SHA256SUMS
